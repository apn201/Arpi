<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="Consolas, Menlo, monospace">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="1200" height="800" fill="#ffffff"/>
  <text x="40" y="56" font-size="28" font-weight="bold" fill="#d62a1e">One frame through ARPI</text>
  <text x="40" y="84" font-size="16" fill="#555">OpenCV first. ARPI on what it cannot read, and on what it reads. Rules stay hard, witnesses add.</text>

  <!-- row A: cascade -->
  <rect x="40" y="120" width="150" height="80" rx="10" fill="#fff6f5" stroke="#d62a1e" stroke-width="2"/>
  <text x="62" y="156" font-size="18" font-weight="bold" fill="#111">Frame</text>
  <text x="62" y="180" font-size="14" fill="#333">+ state</text>

  <rect x="230" y="120" width="230" height="80" rx="10" fill="#f7f7f7" stroke="#222" stroke-width="2"/>
  <text x="248" y="154" font-size="16" font-weight="bold" fill="#111">OpenCV decoder</text>
  <text x="248" y="178" font-size="14" fill="#333">cv2.barcode, fast path</text>

  <rect x="520" y="120" width="330" height="80" rx="10" fill="#f7f7f7" stroke="#222" stroke-width="2"/>
  <text x="538" y="154" font-size="16" font-weight="bold" fill="#111">Check OpenCV's read</text>
  <text x="538" y="178" font-size="14" fill="#333">does it explain the bars?</text>

  <rect x="900" y="120" width="260" height="80" rx="10" fill="#effff4" stroke="#1f9d55" stroke-width="2"/>
  <text x="918" y="154" font-size="16" font-weight="bold" fill="#111">Read, checked</text>
  <text x="918" y="178" font-size="14" fill="#333">EAN-13 / UPC-A only</text>

  <line x1="190" y1="160" x2="225" y2="160" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <line x1="460" y1="160" x2="515" y2="160" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <text x="466" y="150" font-size="13" fill="#333">read</text>
  <line x1="850" y1="160" x2="895" y2="160" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <text x="856" y="150" font-size="13" fill="#1f9d55">ok</text>
  <line x1="345" y1="200" x2="345" y2="275" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <text x="352" y="242" font-size="13" fill="#333">no read</text>
  <line x1="685" y1="200" x2="685" y2="275" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <text x="692" y="242" font-size="13" fill="#d62a1e">disagrees</text>

  <!-- row B: vision -->
  <text x="40" y="270" font-size="14" fill="#d62a1e">ARPI, vision (OpenCV 5)</text>
  <rect x="40" y="280" width="250" height="90" rx="10" fill="#fff6f5" stroke="#d62a1e" stroke-width="2"/>
  <text x="58" y="310" font-size="16" font-weight="bold" fill="#111">Localise</text>
  <text x="58" y="334" font-size="13" fill="#333">gradient orientation</text>
  <text x="58" y="352" font-size="13" fill="#333">coherence</text>

  <rect x="310" y="280" width="170" height="90" rx="10" fill="#fff6f5" stroke="#d62a1e" stroke-width="2"/>
  <text x="328" y="310" font-size="16" font-weight="bold" fill="#111">Rectify</text>
  <text x="328" y="334" font-size="13" fill="#333">symbol's own</text>
  <text x="328" y="352" font-size="13" fill="#333">quadrilateral</text>

  <rect x="510" y="280" width="340" height="90" rx="10" fill="#fff6f5" stroke="#d62a1e" stroke-width="2"/>
  <text x="528" y="310" font-size="16" font-weight="bold" fill="#111">32 scanlines, grid fit</text>
  <text x="528" y="334" font-size="13" fill="#333">offset, module width, bend</text>
  <text x="528" y="352" font-size="13" fill="#333">+ piecewise warp for tears</text>

  <rect x="880" y="280" width="280" height="90" rx="10" fill="#fff6f5" stroke="#d62a1e" stroke-width="2"/>
  <text x="898" y="310" font-size="16" font-weight="bold" fill="#111">Confidence map</text>
  <text x="898" y="334" font-size="13" fill="#333">95 modules, each</text>
  <text x="898" y="352" font-size="13" fill="#333">p_bar + confidence</text>

  <line x1="290" y1="325" x2="305" y2="325" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <line x1="480" y1="325" x2="505" y2="325" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <line x1="850" y1="325" x2="875" y2="325" stroke="#333" stroke-width="2" marker-end="url(#a)"/>

  <!-- row C: reasoning -->
  <text x="40" y="432" font-size="14" fill="#c98a00">ARPI, reasoning (deterministic, no model)</text>
  <rect x="40" y="445" width="300" height="130" rx="10" fill="#fffaf0" stroke="#c98a00" stroke-width="2"/>
  <text x="58" y="474" font-size="16" font-weight="bold" fill="#111">Other witnesses</text>
  <text x="58" y="498" font-size="13" fill="#333">printed digits, CRNN on</text>
  <text x="58" y="516" font-size="13" fill="#333">cells cut by the grid</text>
  <text x="58" y="540" font-size="13" fill="#333">earlier frames (state)</text>
  <text x="58" y="562" font-size="13" fill="#333">code list, optional</text>

  <rect x="370" y="455" width="250" height="110" rx="10" fill="#fffaf0" stroke="#c98a00" stroke-width="2"/>
  <text x="388" y="484" font-size="16" font-weight="bold" fill="#111">Evidence</text>
  <text x="388" y="508" font-size="13" fill="#333">log-likelihood per</text>
  <text x="388" y="526" font-size="13" fill="#333">digit per position.</text>
  <text x="388" y="550" font-size="13" fill="#333">Soft sources capped</text>

  <rect x="650" y="455" width="250" height="110" rx="10" fill="#fffaf0" stroke="#c98a00" stroke-width="2"/>
  <text x="668" y="484" font-size="16" font-weight="bold" fill="#111">K-best search</text>
  <text x="668" y="508" font-size="13" fill="#333">hard rules: guards,</text>
  <text x="668" y="526" font-size="13" fill="#333">parity, checksum, GS1</text>
  <text x="668" y="550" font-size="13" fill="#333">prefix, list</text>

  <rect x="930" y="445" width="230" height="135" rx="10" fill="#effff4" stroke="#1f9d55" stroke-width="2"/>
  <text x="948" y="484" font-size="16" font-weight="bold" fill="#111">Result</text>
  <text x="948" y="508" font-size="13" fill="#333">read</text>
  <text x="948" y="526" font-size="13" fill="#333">only one in list fits</text>
  <text x="948" y="544" font-size="13" fill="#333">ranked candidates</text>
  <text x="948" y="562" font-size="13" fill="#333">per-digit only</text>

  <polyline points="1020,370 1020,410 495,410 495,450" fill="none" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <text x="700" y="402" font-size="13" fill="#333">bars</text>
  <line x1="340" y1="510" x2="365" y2="510" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <line x1="620" y1="510" x2="645" y2="510" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <line x1="900" y1="510" x2="925" y2="510" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <polyline points="1160,160 1185,160 1185,510 1165,510" fill="none" stroke="#333" stroke-width="2" marker-end="url(#a)"/>

  <!-- row D: agent -->
  <rect x="440" y="625" width="470" height="140" rx="10" fill="#f2f6ff" stroke="#3a6fd8" stroke-width="2"/>
  <text x="458" y="654" font-size="16" font-weight="bold" fill="#111">Agent: stop, or ask for a better shot</text>
  <text x="458" y="680" font-size="13" fill="#333">stop: read, or the list leaves one code</text>
  <text x="458" y="700" font-size="13" fill="#333">tilt: glare fraction high</text>
  <text x="458" y="720" font-size="13" fill="#333">hold still: sharpness low</text>
  <text x="458" y="740" font-size="13" fill="#333">reshoot one half: its confidence low</text>
  <text x="458" y="758" font-size="13" fill="#333">show the printed digits, load a list</text>

  <rect x="950" y="625" width="210" height="140" rx="10" fill="#effff4" stroke="#1f9d55" stroke-width="2"/>
  <text x="968" y="654" font-size="16" font-weight="bold" fill="#111">Person</text>
  <text x="968" y="680" font-size="13" fill="#333">confirms anything</text>
  <text x="968" y="700" font-size="13" fill="#333">reconstructed, or</text>
  <text x="968" y="720" font-size="13" fill="#333">picks a candidate</text>

  <polyline points="1045,580 1045,605 675,605 675,620" fill="none" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <line x1="910" y1="695" x2="945" y2="695" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <polyline points="440,695 20,695 20,160 35,160" fill="none" stroke="#3a6fd8" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a)"/>
  <text x="40" y="660" font-size="13" fill="#3a6fd8">next frame,</text>
  <text x="40" y="678" font-size="13" fill="#3a6fd8">evidence carried over</text>
</svg>
